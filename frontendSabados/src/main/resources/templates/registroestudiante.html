<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Estudiante</title>
    <!-- Incluimos Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 0;
        }
        .form-input {
            @apply mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500 transition duration-150;
        }
    </style>
</head>
<body>

<div class="bg-white p-8 md:p-10 rounded-xl shadow-2xl w-full max-w-2xl border-t-4 border-indigo-600">
    <h1 class="text-3xl font-extrabold text-gray-800 mb-8 text-center">
        Registro de Estudiante (DTO)
    </h1>

    <!-- Enlazamos el formulario al objeto estudianteDTO que viene del Controller -->
    <form th:action="@{/registroestudiante}" th:object="${estudianteDto}" method="post" class="space-y-6 grid grid-cols-1 md:grid-cols-2 gap-6">

        <!-- Fila 1: Nombres y Apellidos -->
        <div>
            <label for="nombres" class="block text-sm font-medium text-gray-700 mb-1">Nombres</label>
            <input type="text" id="nombres" th:field="*{nombres}" required placeholder="Nombres" class="form-input">
        </div>
        <div>
            <label for="apellidos" class="block text-sm font-medium text-gray-700 mb-1">Apellidos</label>
            <input type="text" id="apellidos" th:field="*{apellidos}" required placeholder="Apellidos" class="form-input">
        </div>

        <!-- Fila 2: Identificación y Programa -->
        <div>
            <label for="cedula" class="block text-sm font-medium text-gray-700 mb-1">Identificación</label>
            <input type="text" id="cedula" th:field="*{identificacion}" required placeholder="Documento de Identidad" class="form-input">
        </div>
        <div>
            <label for="programa" class="block text-sm font-medium text-gray-700 mb-1">Programa Académico</label>
            <input type="text" id="programa" th:field="*{programa}" required placeholder="Ej: Ingeniería de Sistemas" class="form-input">
        </div>

        <!-- Fila 3: Email y Celular -->
        <div>
            <label for="correoElectronico" class="block text-sm font-medium text-gray-700 mb-1">Correo Electrónico</label>
            <input type="email" id="correoElectronico" th:field="*{email}" required placeholder="ejemplo@universidad.edu" class="form-input">
        </div>
        <div>
            <label for="celular" class="block text-sm font-medium text-gray-700 mb-1">Celular</label>
            <input type="tel" id="celular" th:field="*{celular}" required placeholder="3XX-XXX-XXXX" class="form-input">
        </div>

        <!-- Fila 4: Fechas (Ocupan un slot cada una) -->
        <div>
            <label for="fechaNacimiento" class="block text-sm font-medium text-gray-700 mb-1">Fecha de Nacimiento</label>
            <input type="date" id="fechaNacimiento" th:field="*{fechaNacimiento}" required class="form-input">
        </div>
        <div>
            <label for="fechaIngreso" class="block text-sm font-medium text-gray-700 mb-1">Fecha de Ingreso</label>
            <input type="date" id="fechaIngreso" th:field="*{fechaIngreso}" required class="form-input">
        </div>

        <!-- Fila 5: Dirección (Ocupa las dos columnas) -->
        <div class="md:col-span-2">
            <label for="direccion" class="block text-sm font-medium text-gray-700 mb-1">Dirección de Residencia</label>
            <input type="text" id="direccion" th:field="*{direccion}" required placeholder="Calle 10 # 5-20" class="form-input">
        </div>

        <!-- Botón de Envío (Ocupa las dos columnas) -->
        <div class="md:col-span-2 pt-4">
            <button
                    type="submit"
                    class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-md text-base font-semibold text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-300 transform hover:scale-[1.005]"
            >
                Registrar Estudiante
            </button>
        </div>
        <div class="md:col-span-2 pt-4">
            <!-- Link hacia la página de estudiantes -->
            <a th:href="@{/estudiantes}" class="inline-flex items-center text-indigo-600 hover:text-indigo-800 text-base font-medium transition duration-150 border-b border-indigo-600">
            <svg class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16l-4-4m0 0l4-4m-4 4h18"></path></svg>
                 Regresar a estudiantes
            </a>
        </div>
    </form>

</div>

</body>
</html>
