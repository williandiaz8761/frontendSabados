<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Estudiantes</title>
    <!-- Bootstrap CSS para un diseño limpio -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Listado de Estudiantes</h2>
        <!-- Link hacia la página para registrar nuevo estudiente -->
        <a th:href="@{/registroestudiante}" class="btn btn-primary">Registrar Nuevo Estudiante</a>
    </div>

    <!-- Mensaje de error si falla la API -->
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <!-- Tabla de Estudiantes -->
    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-striped table-hover align-middle">
                <thead class="table-dark">
                <tr>
                    <th>Identificación</th>
                    <th>Nombres y Apellidos</th>
                    <th>Email</th>
                    <th>Celular</th>
                    <th>Programa</th>
                    <th>Fecha Ingreso</th>
                </tr>
                </thead>
                <tbody>
                <!-- Iterando directamente sobre la lista completa -->
                <tr th:each="estudiante : ${estudiantes}">
                    <td th:text="${estudiante.identificacion}">12345678</td>
                    <td th:text="${estudiante.nombres + ' ' + estudiante.apellidos}">Juan Pérez</td>
                    <td th:text="${estudiante.email}">juan@mail.com</td>
                    <td th:text="${estudiante.celular}">3001234567</td>
                    <td th:text="${estudiante.programa}">Ingeniería</td>
                    <!-- Formateando el LocalDate con temporals como vimos antes -->
                    <td th:text="${estudiante.fechaIngreso != null ? #temporals.format(estudiante.fechaIngreso, 'dd/MM/yyyy') : '-'}">01/01/2025</td>
                </tr>
                <!-- Mensaje si la lista viene vacía -->
                <tr th:if="${estudiantes == null || estudiantes.empty}">
                    <td colspan="7" class="text-center text-muted">No hay estudiantes registrados.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
